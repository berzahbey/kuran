<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dedplay Kur'ân-ı Kerîm Çalışma</title>
<link rel="icon" type="image/svg+xml" href="/static/ikon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/ikon-192.png">
<meta name="theme-color" content="#1f6f5c">
<style>
@font-face{font-family:"AmiriQuran";src:url(/static/font/AmiriQuran.ttf)}
@font-face{font-family:"Amiri";src:url(/static/font/Amiri-Regular.ttf)}
@font-face{font-family:"Amiri";font-weight:bold;src:url(/static/font/Amiri-Bold.ttf)}
:root{--bg:#f7f5f0;--kart:#fff;--yazi:#1f2328;--soluk:#6b6f76;--cizgi:#e4e0d6;--vurgu:#1f6f5c;--vurgu2:#e8f2ee;--uyari:#a15c00;--sec:#fff7e0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--yazi);font-size:15px}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--vurgu);color:#fff;position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
header input,header select{padding:6px 8px;border-radius:6px;border:0;font-size:14px}
header input{flex:1;min-width:120px;max-width:380px}
header select{max-width:230px;min-width:90px}
header label{flex-shrink:0}
@media (max-width:1100px){header .etiket-yazi{display:none} header select{max-width:150px}}
@media (max-width:900px){header h1{font-size:0} header h1 img{margin:0}}
header button{white-space:nowrap;flex-shrink:0;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px}
header button:hover{background:rgba(255,255,255,.28)}
.duzen{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1.15fr);height:calc(100vh - 46px)}
.duzen.panel-kapali{grid-template-columns:220px minmax(0,1fr) 0}
nav#sureler{overflow:auto;border-right:1px solid var(--cizgi);background:#fbfaf6}
nav#sureler input{width:calc(100% - 16px);margin:8px;padding:6px;border:1px solid var(--cizgi);border-radius:6px}
.sure-oge{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;cursor:pointer;border-bottom:1px solid #f0ede5}
.sure-oge:hover{background:var(--vurgu2)}.sure-oge.secili{background:var(--vurgu);color:#fff}
.sure-oge .ar{font-family:Amiri,serif;font-size:17px}
.sure-oge small{color:var(--soluk);font-size:11px}.sure-oge.secili small{color:#dfe}
.rozet{display:inline-block;font-size:10px;padding:1px 5px;border-radius:8px;background:var(--vurgu2);color:var(--vurgu);margin-left:3px}
main#metin{overflow:auto;padding:16px 22px}
.sure-baslik{text-align:center;margin:6px 0 18px}
.sure-baslik .ar{font-family:AmiriQuran,Amiri,serif;font-size:30px}
.sure-baslik h2{margin:2px 0;font-size:20px}
.besmele{text-align:center;font-family:AmiriQuran,Amiri,serif;font-size:26px;margin-bottom:14px}
.ayet{background:var(--kart);border:1px solid var(--cizgi);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.1s}
.ayet:hover{border-color:#b8d4ca}.ayet.secili{border-color:var(--vurgu);box-shadow:0 0 0 2px var(--vurgu2);background:var(--sec)}
.ayet .ar{font-family:AmiriQuran,Amiri,serif;font-size:27px;line-height:2.15;direction:rtl;text-align:right}
body.arapca-gizli main .ayet .ar,body.arapca-gizli main .besmele{display:none}
.sade-no{display:none;font-size:11px;color:#b5b0a4;margin-right:8px;font-family:system-ui;vertical-align:2px}
body.arapca-gizli .sade-no{display:inline}
body.arapca-gizli main .ayet{padding:9px 14px;margin-bottom:6px;border-color:transparent;background:transparent}
body.arapca-gizli main .ayet:hover{background:var(--kart);border-color:var(--cizgi)}
body.arapca-gizli main .ayet.secili{background:var(--sec);border-color:var(--vurgu)}
body.arapca-gizli main .ayet .yalin{margin-top:0;font-size:18px}
header button.acik{background:#fff;color:var(--vurgu)}
.ayet .yalin.osm,.panel-meal .osm{direction:rtl;text-align:right;font-family:Amiri,serif;font-size:22px;line-height:2.1}
.panel-meal .osm{font-size:20px;margin-bottom:2px}
body.arapca-gizli main .ayet .yalin.osm{font-size:24px;font-family:Amiri,serif}
.ayet .yalin.osm .sade-no{float:right;margin:6px 0 0 8px;direction:ltr;font-family:system-ui}
.dn-pop[dir=rtl]{font-family:Amiri,serif;font-size:18px;line-height:1.8;text-align:right}
.osm-yok{font-size:11px;color:#b0a37a;font-style:italic;font-family:system-ui}
.ayet .yalin{margin-top:6px;font-size:17px;line-height:1.55;font-family:Georgia,"Times New Roman",serif}
.ayet .yalin.eksik{color:#b0aca2;font-style:italic;font-size:14px;font-family:inherit}
.besmele-sade{display:none;text-align:center;font-family:Georgia,serif;font-style:italic;color:var(--soluk);margin:0 0 16px}
.besmele-sade.osm-b{font-family:Amiri,serif;font-style:normal;font-size:20px}
body.arapca-gizli main .besmele-sade{display:block}
.besmele-tr.osm-b{font-family:Amiri,serif;font-style:normal;font-size:18px}
.besmele-tr{font-family:Georgia,serif;font-style:italic;font-size:14px;color:var(--soluk)}
.duzenle{text-decoration:none;color:var(--soluk);font-size:14px;margin-left:4px}
.inis-kutu{background:var(--vurgu2);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.inis-detay{margin-bottom:12px}.inis-detay summary{display:none}
.panel-meal{font-family:Georgia,serif;font-size:16px;margin:2px 0 6px}
button.dn{border:0;background:var(--vurgu);color:#fff;border-radius:9px;font-size:10.5px;line-height:1;padding:2px 5px;vertical-align:super;cursor:pointer;margin:0 1px;font-family:system-ui}
.dn-pop{position:absolute;z-index:60;max-width:420px;background:#fffdf3;border:1px solid #e5d9a8;border-radius:8px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.15);font-size:14px;line-height:1.5}
.ayet .meal.meal-rtl{direction:rtl;text-align:right;font-family:Amiri,serif;font-size:19px;line-height:1.9}
.ayet .meal.meal-rtl .kucuk{direction:ltr;display:inline-block;font-family:system-ui}
.ayet-resim{display:block;max-width:100%;margin:4px 0 0 auto;border-radius:4px}
.ayet .meal{margin-top:6px;color:var(--soluk);font-size:14px;border-top:1px dashed var(--cizgi);padding-top:5px}
.ayet .ust{display:flex;justify-content:space-between;font-size:12px;color:var(--soluk)}
.no{font-family:AmiriQuran,Amiri,serif}
aside#panel{overflow:auto;border-left:1px solid var(--cizgi);background:var(--kart);display:flex;flex-direction:column}
.panel-ust{padding:10px 14px;border-bottom:1px solid var(--cizgi);position:sticky;top:0;background:var(--kart);z-index:5}
.panel-ust .baslik{display:flex;justify-content:space-between;align-items:center}
.panel-ust .ar{font-family:AmiriQuran,Amiri,serif;font-size:24px;direction:rtl;text-align:right;line-height:2;margin:4px 0}
.sekmeler{display:flex;gap:2px;flex-wrap:wrap;margin-top:6px}
.sekmeler button{border:0;background:#f1efe8;padding:7px 12px;font-weight:500;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px}
.sekmeler button.aktif{background:var(--vurgu);color:#fff}
.icerik{padding:12px 14px}
.kucuk{font-size:12px;color:var(--soluk)}
.btn{background:var(--vurgu);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px}
.btn.ikincil{background:#eceae3;color:var(--yazi)}.btn:disabled{opacity:.5;cursor:wait}
.kelimeler{display:flex;flex-wrap:wrap;gap:8px;direction:rtl}
.kelime{border:1px solid var(--cizgi);border-radius:8px;padding:6px 8px;min-width:90px;text-align:center;direction:ltr;background:#fcfbf8}
.kelime .ar{font-family:Amiri,serif;font-size:24px;direction:rtl}
.kelime .kok{font-family:Amiri,serif;font-size:18px;color:var(--vurgu);cursor:pointer;text-decoration:underline dotted}
.kelime .etk{font-size:10.5px;color:var(--soluk);max-width:150px}
.grup{margin-bottom:14px}.grup h4{margin:8px 0 4px;font-size:13px;color:var(--vurgu);text-transform:uppercase;letter-spacing:.04em}
.oge{border-bottom:1px solid #f0ede5;padding:7px 0}
.oge b{font-size:13px}
.rtl{direction:rtl;text-align:right;font-family:Amiri,serif;font-size:19px;line-height:1.9}
.tefsir-metin{white-space:pre-wrap;max-height:60vh;overflow:auto;background:#fbfaf6;border:1px solid var(--cizgi);border-radius:6px;padding:10px;margin-top:6px}
.cipler{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.cip{border:1px solid var(--cizgi);background:#fff;border-radius:12px;padding:2px 9px;font-size:12px;cursor:pointer}
.cip.aktif{background:var(--vurgu);color:#fff;border-color:var(--vurgu)}
.kiraat.farkli{background:#fff4e0;border-left:3px solid var(--uyari);padding-left:8px}
textarea,input.tam{width:100%;padding:8px;border:1px solid var(--cizgi);border-radius:6px;font:inherit}
textarea{min-height:80px}
.not{background:#fffdf3;border:1px solid #efe6c4;border-radius:8px;padding:8px 10px;margin:8px 0}
.not .alt{display:flex;justify-content:space-between;font-size:11px;color:var(--soluk);margin-top:4px}
.md h2{font-size:15px;color:var(--vurgu);margin:14px 0 4px}.md h3{font-size:14px;margin:10px 0 4px}.md ul{padding-left:20px;margin:4px 0}
.modal-arka{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:12px;width:min(900px,94vw);max-height:88vh;overflow:auto;padding:18px 20px;position:relative}
.modal .kapat{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer}
.lane{font-size:14px;line-height:1.6}.lane .ar{font-family:Amiri,serif;font-size:18px}
.istat{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:10px 0}
.istat div{background:#f6f4ee;border-radius:8px;padding:8px}.istat b{display:block;font-size:18px}
pre.log{background:#1f2328;color:#d7e3dc;padding:8px;border-radius:6px;font-size:12px;max-height:200px;overflow:auto;white-space:pre-wrap}
.bos{color:var(--soluk);text-align:center;padding:30px}
.yukleniyor{color:var(--soluk);padding:12px}
mark{background:#ffe9a8}
.k-orta{background:#fff1c7;border-radius:3px}.k-az{background:#ffd9a8;border-radius:3px}.k-tek{background:#f8b4a6;border-radius:3px;font-weight:600}
.k-ek{font-style:italic;color:#8a6d3b}.k-sec{outline:2px solid var(--vurgu);border-radius:3px}.k-satir{background:var(--vurgu2)}
.k-metin span[data-k]{cursor:pointer}
</style>
</head>
<body>
<header>
  <h1><img src="/static/ikon.svg" alt="" style="width:26px;height:26px;vertical-align:-7px;margin-right:6px;border-radius:6px">Dedplay Kur'ân-ı Kerîm Çalışma</h1>
  <input id="ara" placeholder="Ara: Arapça veya Türkçe (örn. القلم, sabır)…">
  <label style="font-size:13px;white-space:nowrap"><span class="etiket-yazi">Karşılaştır: </span><select id="mealSec" title="Yalın mealin altında gösterilecek karşılaştırma meali"></select></label>
  <button id="dilDugme" onclick="dilDegistir()" title="Ana meali Türkçe / Osmanlıca göster">Türkçe ⇄ عثمانلیجه</button>
  <button id="arDugme" onclick="arapcaDegistir()" title="Arapça aslını göster/gizle">ع Arapça</button>
  <button onclick="notlarAc()">Notlarım</button>
  <button onclick="kitapAc()">E-Kitap</button>
  <button onclick="kaynakAc()">Kaynaklar</button>
</header>
<div class="duzen panel-kapali" id="duzen">
  <nav id="sureler"><input id="sureFiltre" placeholder="Sure ara…"><div id="sureListe"></div></nav>
  <main id="metin"><div class="bos">Soldan bir sure seçin.</div></main>
  <aside id="panel"></aside>
</div>
<div class="modal-arka" id="modalArka" onclick="if(event.target===this)modalKapat()"><div class="modal"><button class="kapat" onclick="modalKapat()">×</button><div id="modalIcerik"></div></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=t=>(t??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arRakam=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const AR=/[؀-ۿ]/;
async function api(u,o={}){const r=await fetch(u,{headers:{"Content-Type":"application/json"},...o});if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail}catch(e){}throw new Error(m)}return r.headers.get("content-type")?.includes("json")?r.json():r.text()}
function md(t){ // basit markdown
  t=esc(t);t=t.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h2>$1</h2>")
   .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|\s)_(.+?)_(?=\s|$)/g,"$1<i>$2</i>");
  t=t.replace(/(^|\n)((?:\s*[-*] .*(?:\n|$))+)/g,(m,a,b)=>a+"<ul>"+b.trim().split("\n").map(l=>"<li>"+l.replace(/^\s*[-*] /,"")+"</li>").join("")+"</ul>");
  return t.replace(/\n\n/g,"<br><br>").replace(/([^>])\n/g,"$1<br>");
}
const DILLER={Turkish:"Türkçe",Ottoman:"Osmanlıca",Dutch:"Hollandaca",English:"İngilizce",German:"Almanca",French:"Fransızca",Bosnian:"Boşnakça",Azerbaijani:"Azerice"};
const D={dil:(()=>{try{return localStorage.getItem("dil")||"tr"}catch(e){return "tr"}})(),arapca:(()=>{try{return localStorage.getItem("arapca")==="1"}catch(e){return false}})(),yz:false,sureler:[],s:null,a:null,meal:(()=>{try{return localStorage.getItem("karsilastir")||""}catch(e){return ""}})(),sekme:"kelime",ayet:null};

function dilDegistir(){D.dil=D.dil==="osm"?"tr":"osm";try{localStorage.setItem("dil",D.dil)}catch(e){};dilUygula();if(D.s)sureAc(D.s,D.a)}
function dilUygula(){const b=$("#dilDugme");b.textContent=D.dil==="osm"?"عثمانلیجه ⇄ Türkçe":"Türkçe ⇄ عثمانلیجه";b.classList.toggle("acik",D.dil==="osm")}
function arapcaDegistir(){D.arapca=!D.arapca;try{localStorage.setItem("arapca",D.arapca?"1":"0")}catch(e){};arapcaUygula()}
function arapcaUygula(){document.body.classList.toggle("arapca-gizli",!D.arapca);$("#arDugme").classList.toggle("acik",D.arapca)}
async function basla(){
  arapcaUygula(); dilUygula();
  try{D.yz=(await api("/api/ayarlar")).yapay_zeka}catch(e){D.yz=false}
  D.sureler=await api("/api/sureler"); sureListe();
  const ml=await api("/api/meal-kaynaklari"); const sel=$("#mealSec");
  sel.innerHTML='<option value="">— yok —</option>'+ml.filter(m=>DILLER[m.dil]).sort((a,b)=>Object.keys(DILLER).indexOf(a.dil)-Object.keys(DILLER).indexOf(b.dil)).map(m=>`<option value="${m.id}">${esc(m.dil==="Turkish"?"":DILLER[m.dil]+": ")}${esc(m.yazar)}</option>`).join("");
  sel.value=D.meal; sel.onchange=()=>{D.meal=sel.value;try{localStorage.setItem("karsilastir",D.meal)}catch(e){};if(D.s)sureAc(D.s,D.a)};
  const h=location.hash.match(/(\d+)(?::(\d+))?/); sureAc(h?+h[1]:68,h&&h[2]?+h[2]:null);
}
function sureListe(){
  const f=$("#sureFiltre").value.toLowerCase();
  $("#sureListe").innerHTML=D.sureler.filter(x=>!f||(x.s+" "+x.ad).toLowerCase().includes(f)||x.ad_ar.includes(f)).map(x=>
   `<div class="sure-oge ${x.s===D.s?"secili":""}" onclick="sureAc(${x.s})"><div>${x.s}. ${esc(x.ad)}<br><small>${x.ayet} ayet${x.nuzul?" · "+(x.nuzul==="Mecca"?"Mekkî":"Medenî"):""}</small>${x.yalin?`<span class="rozet">${x.yalin===x.ayet?"✓ meal":"meal "+x.yalin+"/"+x.ayet}</span>`:""}${x.not?`<span class="rozet">not ${x.not}</span>`:""}</div><span class="ar">${esc(x.ad_ar)}</span></div>`).join("");
}
$("#sureFiltre").oninput=sureListe;

const dipnotluMetin=(m,notlar)=>esc(m).replace(/\[(\d+)\]/g,(x,n)=>notlar&&notlar[n-1]!=null?`<button class="dn" data-not="${esc(notlar[n-1])}" onclick="dipnotGoster(event,this)">${n}</button>`:"");
function dipnotGoster(e,b){e.stopPropagation();dipnotKapat();const p=document.createElement("div");p.className="dn-pop";p.textContent=b.dataset.not;if(/[\u0600-\u06FF]/.test(b.dataset.not))p.setAttribute("dir","rtl");document.body.appendChild(p);
  const r=b.getBoundingClientRect();p.style.top=(window.scrollY+r.bottom+6)+"px";p.style.left=Math.max(8,Math.min(r.left-20,innerWidth-p.offsetWidth-12))+"px"}
function dipnotKapat(){document.querySelectorAll(".dn-pop").forEach(x=>x.remove())}
document.addEventListener("click",dipnotKapat);
async function sureAc(s,a=null){
  D.s=s; sureListe(); $("#metin").innerHTML='<div class="yukleniyor">Yükleniyor…</div>';
  const d=await api(`/api/sure/${s}?meal=${D.meal}`); const b=D.sureler[s-1]; const hazir=d.ayetler.filter(x=>x.yalin_durum==="onayli"||x.yalin_durum==="taslak").length; const onayli=d.ayetler.filter(x=>x.yalin_durum==="onayli").length;
  const kars=D.meal?$("#mealSec").selectedOptions[0]?.textContent:"";
  $("#metin").innerHTML=`<div class="sure-baslik"><div class="ar">${esc(b.ad_ar)}</div><h2>${esc(d.ad)} Sûresi</h2>
   <span class="kucuk">${s}. sure · ${b.nuzul==="Mecca"?"Mekkî":"Medenî"} · iniş sırası ${b.sira} · ${b.ayet} ayet${onayli===b.ayet?" · ✓ onaylı meal":(onayli?` · ${onayli}/${b.ayet} ayet onaylı`:"")} · <a href="#" onclick="ayetSec(${s},0);return false">sure notları</a> · <a href="/api/yalin/disa-aktar/${s}" title="Bu surenin mealini inceleme/düzeltme için JSON olarak indir">inceleme dosyası ⇩</a></span></div>
   ${s!==1&&s!==9?`<div class="besmele">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ<div class="besmele-tr${D.dil==="osm"?" osm-b":""}">${D.dil==="osm"?"رحمان و رحیم اولان اللّهڭ اسمیله":"Rahmân ve Rahîm olan Allah'ın ismiyle"}</div></div><div class="besmele-sade${D.dil==="osm"?" osm-b":""}">${D.dil==="osm"?"رحمان و رحیم اولان اللّهڭ اسمیله":"Rahmân ve Rahîm olan Allah'ın ismiyle"}</div>`:""}`+
   d.ayetler.map(x=>`<div class="ayet" id="ay${x.a}" onclick="ayetSec(${s},${x.a})">
     <div class="ar">${esc(x.arapca)} <span class="no">﴿${arRakam(x.a)}﴾</span></div>
     ${x.yalin&&D.dil==="osm"?(x.yalin_osm?`<div class="yalin osm"><span class="sade-no">${x.a}</span>${dipnotluMetin(x.yalin_osm,x.dipnotlar_osm)}</div>`:`<div class="yalin"><span class="sade-no">${x.a}</span>${dipnotluMetin(x.yalin,x.dipnotlar)}<div class="osm-yok">Osmanlıcası çeviricide hazırlanıyor</div></div>`):x.yalin?`<div class="yalin"><span class="sade-no">${x.a}</span>${dipnotluMetin(x.yalin,x.dipnotlar)}</div>`:(x.yalin_durum==="birlesik"?`<div class="yalin eksik"><span class="sade-no">${x.a}</span>↑ önceki ayetle birlikte çevrildi</div>`:`<div class="yalin eksik"><span class="sade-no">${x.a}</span>Yalın meal henüz hazırlanmadı.</div>`)}
     ${x.meal?`<div class="meal ${d.meal_yon==="rtl"?"meal-rtl":""}"><span class="kucuk">${esc(kars)}${d.meal_sayfa[x.a]?` · <a href="#" onclick="event.stopPropagation();sayfaGoster('${D.meal}',${d.meal_sayfa[x.a]});return false">s. ${d.meal_sayfa[x.a]}</a>`:""}:</span> ${d.meal_resim?`<img class="ayet-resim" src="${x.meal}" loading="lazy" alt="">`:esc(x.meal)}</div>`:""}
     ${x.not?`<div class="ust"><span></span><span>✎ ${x.not} not</span></div>`:""}</div>`).join("");
  if(a){ayetSec(s,a);document.getElementById("ay"+a)?.scrollIntoView({block:"center"})} else $("#metin").scrollTop=0;
}

async function ayetSec(s,a){
  D.s=s;D.a=a; location.hash=`${s}:${a}`;
  document.querySelectorAll(".ayet.secili").forEach(e=>e.classList.remove("secili")); document.getElementById("ay"+a)?.classList.add("secili");
  $("#duzen").classList.remove("panel-kapali");
  if(a===0){ D.ayet=null; panelCiz(`<div class="baslik"><b>${s}. ${esc(D.sureler[s-1].ad)} Sûresi — genel notlar</b><button class="btn ikincil" onclick="panelKapat()">×</button></div>`); return notlarSekme(); }
  $("#panel").innerHTML='<div class="yukleniyor">Yükleniyor…</div>';
  D.ayet=await api(`/api/ayet/${s}/${a}`);
  const sek=[["kelime","Kelime & Lügat"],["mealler","Mealler"],["tefsir","Tefsir & İniş"],["hadisler","Hadis"],["notlar",`Notlarım${D.ayet.notlar.length?" ("+D.ayet.notlar.length+")":""}`]];
  if(!sek.some(x=>x[0]===D.sekme)&&D.sekme!=="yalin")D.sekme="kelime";
  const ym=D.ayet.yalin;
  panelCiz(`<div class="baslik"><b>${esc(D.ayet.sure)} ${s}:${a}</b><span><button class="btn ikincil" title="Önceki ayet (↑)" onclick="ayetSec(${s},${Math.max(1,a-1)})">‹</button> <button class="btn ikincil" title="Sonraki ayet (↓)" onclick="ayetSec(${s},${Math.min(D.sureler[s-1].ayet,a+1)})">›</button> <button class="btn ikincil" title="Kapat (Esc)" onclick="panelKapat()">×</button></span></div>
    <div class="ar">${esc(D.ayet.arapca)}</div>
    <div class="panel-meal">${ym&&D.dil==="osm"&&ym.metin_osm?`<div class="osm">${dipnotluMetin(ym.metin_osm,JSON.parse(ym.dipnotlar_osm||"[]"))}</div>`:""}${ym?dipnotluMetin(ym.metin,JSON.parse(ym.dipnotlar||"[]")):'<span class="kucuk">Yalın meal henüz yok.</span>'} <a href="#" class="duzenle" title="Yalın meali düzenle" onclick="sekme('yalin');return false">✎</a></div>
    <div class="sekmeler">${sek.map(([k,t])=>`<button data-s="${k}" class="${D.sekme===k?"aktif":""}" onclick="sekme('${k}')">${t}</button>`).join("")}</div>`);
  sekme(D.sekme);
}
function panelCiz(ust){$("#panel").innerHTML=`<div class="panel-ust">${ust}</div><div class="icerik" id="ic"></div>`}
function panelKapat(){$("#duzen").classList.add("panel-kapali")}
function sekme(k){if(!$("#ic"))return;D.sekme=k;document.querySelectorAll(".sekmeler button").forEach(b=>b.classList.toggle("aktif",b.dataset.s===k));
  ({kelime:kelimeSekme,mealler:karsilastirSekme,tefsir:tefsirSekme,tefsirler:tefsirSekme,hadisler:hadisSekme,yalin:yalinSekme,notlar:notlarSekme})[k]()}
const ic=h=>$("#ic").innerHTML=h;
const yukle=()=>ic('<div class="yukleniyor">Yükleniyor… (yerelde yoksa internetten çekiliyor)</div>');


const GRAM={PASS_PCPL:"ism-i mef'ûl",ACT_PCPL:"ism-i fâil",VN:"mastar",GEN:"mecrûr",NOM:"merfû'",ACC:"mansûb",INDEF:"nekre",DEF:"mârife",M:"müzekker",F:"müennes",MS:"müz. tekil",FS:"müen. tekil",MD:"müz. tesniye",FD:"müen. tesniye",MP:"müz. çoğul",FP:"müen. çoğul",
 PRON:"zamir",PREF:"önek",SUFF:"sonek",P:"harf-i cer",IMPF:"muzâri",PERF:"mâzî",IMPV:"emir",PASS:"meçhul",NEG:"nefy",CONJ:"atıf",REL:"ism-i mevsûl",DET:"harf-i tarif (el-)",
 "MOOD:IND":"merfû'","MOOD:SUBJ":"mansûb","MOOD:JUS":"meczûm",EMPH:"tekit",INTG:"istifham",VOC:"nidâ",DEM:"işaret ismi",PN:"özel isim",ADJ:"sıfat",T:"zaman zarfı",LOC:"mekân zarfı",
 COND:"şart",ACC_P:"inne ve kardeşleri",SUB:"masdar edatı",RES:"istisna",EXP:"istisna",CERT:"tahkik",FUT:"istikbâl (se-)",PRP:"amaç (li-)",CIRC:"hâl",COM:"maiyyet",INL:"hurûf-u mukattaa",
 RSLT:"netice (fe-)",REM:"isti'nâf",CAUS:"sebep",SUP:"ziyade",ANS:"cevap",AMD:"istidrak",EQ:"teswiye",RET:"ilgâ",PREV:"men'",AVR:"tehzîr",INC:"başlama",SUR:"sürpriz",INT:"tefsir",EXH:"teşvik",EXL:"açıklama",IMPN:"emir mastarı",
 "1S":"1. tekil","1P":"1. çoğul","2MS":"2. müz. tekil","2FS":"2. müen. tekil","2MD":"2. tesniye","2D":"2. tesniye","2MP":"2. müz. çoğul","2FP":"2. müen. çoğul","3MS":"3. müz. tekil","3FS":"3. müen. tekil","3MD":"3. müz. tesniye","3FD":"3. müen. tesniye","3MP":"3. müz. çoğul","3FP":"3. müen. çoğul"};
function gram(e){return e.split("|").filter(x=>x&&!/^(ROOT|LEM|FAM|SP):/.test(x)).map(x=>/^VF:(\d+)/.test(x)?"bab "+x.slice(3):(GRAM[x]||x)).join(", ")}
function kelimeSekme(){
  const tr={N:"isim",V:"fiil",P:"edat"}; const kf=D.ayet.kiraat.filter(x=>x.farkli);
  ic(`<p class="kucuk">Köke tıklayın: klasik lügat maddesi ve kökün Kur'an'daki tüm geçişleri açılır.</p><div class="kelimeler">${D.ayet.kelimeler.map(w=>`
   <div class="kelime"><div class="ar">${esc(w.form)}</div>
   ${w.kok?`<div class="kok" dir="rtl" onclick="kokAc('${w.kok}')">${esc(w.kok.split("").join(" "))}</div><div class="kucuk">${w.kok_sayisi} geçiş${w.lane_var?"":" · Lane'de yok"}</div>`:'<div class="kucuk">kök yok</div>'}
   ${w.lemma?`<div class="kucuk" dir="rtl">${esc(w.lemma)}</div>`:""}
   <div class="etk">${w.parcalar.map(p=>`<span dir="rtl" style="font-family:Amiri;font-size:14px">${esc(p.form)}</span> ${tr[p.tur]}: ${gram(p.etiket)}`).join("<br>")}</div></div>`).join("")}</div>
   <div class="grup" style="margin-top:18px"><h4>Kıraat</h4>${kf.length?`<p class="kucuk">${kf.length} rivayette farklı okunuyor:</p>`+kf.map(x=>`<div class="oge kiraat farkli"><b>${esc(x.ravi)}</b><div class="rtl">${esc(x.metin)}</div></div>`).join(""):`<p class="kucuk">8 rivayette (Hafs, Şu'be, Verş, Kâlûn, Bezzî, Kunbul, Dûrî, Sûsî) aynı okunuyor.</p>`}</div>`);
}

async function kokAc(kok){
  modalAc('<div class="yukleniyor">Yükleniyor…</div>');
  const d=await api(`/api/kok/${encodeURIComponent(kok)}?meal=${D.meal}`);
  const lem=Object.entries(d.lemmalar).sort((a,b)=>b[1]-a[1]);
  modalAc(`<h2 style="margin-top:0"><bdi dir="rtl" style="font-family:Amiri;font-size:30px">${esc(kok.split("").join(" "))}</bdi> kökü</h2>
   <p class="kucuk">Kur'an'da ${d.gecisler.length} geçiş · türevler: <span dir="rtl" style="font-family:Amiri;font-size:17px">${lem.map(([l,n])=>esc(l)+" ("+n+")").join("، ")}</span></p>
   <h3>Klasik lügat — Lane, <i>An Arabic-English Lexicon</i> (Lisânü'l-Arab, Tâcü'l-Arûs, Kâmûs, Sıhâh derlemesi)</h3>
   ${d.lane?`<div id="laneTr">${d.lane_tr?'<div class="md not">'+md(d.lane_tr)+"</div>":`<button class="btn ikincil" onclick="laneTurkce('${kok}',this)">Türkçeye çevir (yapay zekâ)</button>`}</div><div class="lane">${d.lane.html}</div>`:'<p class="kucuk">Lane\'de bu kök için madde yok. Lügat bilgisi için Tefsirler sekmesindeki "Lügat / İ\'râb" türüne bakın.</p>'}
   <h3>Kur'an'daki geçişleri</h3>${d.gecisler.map(g=>`<div class="oge" style="cursor:pointer" onclick="modalKapat();sureAc(${g.s},${g.a})"><b>${esc(g.sure)} ${g.s}:${g.a}</b> — <span style="font-family:Amiri;font-size:18px">${esc(g.form)}</span><div class="kucuk">${esc(g.meal)}</div></div>`).join("")}`);
}
async function laneTurkce(kok,b){b.disabled=true;b.textContent="Çevriliyor…";try{const d=await api(`/api/kok/${encodeURIComponent(kok)}/turkce`,{method:"POST"});$("#laneTr").innerHTML='<div class="md not">'+md(d.metin)+"</div>"}catch(e){b.disabled=false;b.textContent=e.message}}

let mealDil="Turkish";
async function meallerSekme(){
  yukle(); const g=await api(`/api/ayet/${D.s}/${D.a}/mealler`); mealDil=mealDil||"Turkish";
  const ciz=()=>{const sec=g.filter(x=>mealDil==="hepsi"||x.dil===mealDil);
   ic(`<p><a href="#" onclick="karsilastirSekme();return false">← Karşılaştırmaya dön</a></p><div class="cipler">${["hepsi",...g.map(x=>x.dil)].map(d=>`<span class="cip ${d===mealDil?"aktif":""}" data-d="${d}">${d==="hepsi"?"Tüm diller ("+g.reduce((s,x)=>s+x.mealler.length,0)+")":esc(d)+" ("+(g.find(x=>x.dil===d)?.mealler.length)+")"}</span>`).join("")}</div>`+
    sec.map(x=>`<div class="grup"><h4>${esc(x.dil)}</h4>${x.mealler.map(m=>`<div class="oge"><b>${esc(m.yazar)}</b>${m.sayfa?` <a href="#" class="kucuk" onclick="sayfaGoster('${m.id}',${m.sayfa});return false">kitapta s. ${m.sayfa} ⧉</a>`:""}${m.resim?`<img class="ayet-resim" src="${m.resim}" loading="lazy" alt="">`:`<div ${m.yon==="rtl"?'class="rtl"':""}>${esc(m.metin)}</div>`}</div>`).join("")}</div>`).join(""));
   document.querySelectorAll(".cip").forEach(c=>c.onclick=()=>{mealDil=c.dataset.d;ciz()})};
  ciz();
}

let karDil="Turkish",karSecili=null;
async function karsilastirSekme(){
  yukle(); const d=await api(`/api/ayet/${D.s}/${D.a}/karsilastir?dil=${karDil}`); const ad=Object.fromEntries(d.mealler.map(m=>[m.id,m.yazar]));
  const renk=o=>o==null?"":o>=.6?"":o>=.25?"k-orta":o>.0?"k-az":"";
  const ciz=()=>{
   const kelime=w=>{if(d.sayi<2)return esc(w.t);const tek=w.kok&&w.oran*d.sayi<=1;const c=tek?"k-tek":renk(w.oran);const sec=karSecili&&w.kok===karSecili?" k-sec":"";
     return `<span class="${c}${sec}${w.ek?" k-ek":""}" ${w.kok?`data-k="${w.kok}" title="${Math.round(w.oran*d.sayi)}/${d.sayi} meal"`:""}>${esc(w.t)}</span>`};
   ic(`<div class="cipler">${[["Turkish","Türkçe"],["Ottoman","Osmanlıca"],["English","İngilizce"],["Arabic","Arapça"],["Dutch","Hollandaca"],["German","Almanca"],["French","Fransızca"],["Bosnian","Boşnakça"],["Azerbaijani","Azerice"]].map(([x,y])=>`<span class="cip ${x===karDil?"aktif":""}" data-dil="${x}">${y}</span>`).join("")}<span class="cip" onclick="meallerSekme()">Tüm diller (492) →</span></div>
    ${d.sayi<2?`<p class="kucuk">Bu dilde tek meal var; karşılaştırma için en az iki meal gerekir.</p>`:""}
    <p class="kucuk" style="${d.sayi<2?"display:none":""}">${d.sayi} farklı meal karşılaştırıldı. Renkler: <span class="k-orta">bazı meallerin tercihi</span> · <span class="k-az">az kişinin tercihi</span> · <span class="k-tek">sadece bu meal</span> · <span class="k-ek">(parantez içi ekleme)</span>. Bir kelimeye tıklayınca o tercihi yapan mealler işaretlenir.</p>
    <div class="grup" style="${d.sayi<2?"display:none":""}"><h4>Ortak anlam (meallerin çoğunda)</h4><div class="cipler">${d.ortak.map(o=>`<span class="cip" data-k="${o.kok}">${esc(o.ornek)} · ${o.sayi}</span>`).join("")}</div></div>
    <div class="grup" style="${d.sayi<2?"display:none":""}"><h4>Ayrışan tercihler</h4><div class="cipler">${d.ayrisan.slice(0,40).map(o=>`<span class="cip ${o.kok===karSecili?"aktif":""}" data-k="${o.kok}">${esc(o.ornek)} · ${o.sayi}</span>`).join("")}</div></div>
    <div class="grup" style="${d.sayi<2?"display:none":""}"><h4>Benzer çizgideki mealler</h4>${d.gruplar.filter(g=>g.length>1).map((g,i)=>`<div class="oge"><b>${i+1}. grup</b> <span class="kucuk">(${g.length} meal)</span> ${g.map(x=>esc(ad[x])).join(" · ")}</div>`).join("")}
     ${d.gruplar.filter(g=>g.length===1).length?`<div class="oge"><b>Kendine özgü çeviriler</b> <span class="kucuk">(${d.gruplar.filter(g=>g.length===1).length})</span> ${d.gruplar.filter(g=>g.length===1).map(g=>esc(ad[g[0]])).join(" · ")}</div>`:""}</div>
    <div class="grup"><h4>Mealler</h4>${d.mealler.map(m=>`<div class="oge ${karSecili&&m.kelimeler.some(w=>w.kok===karSecili)?"k-satir":""}"><b>${esc(m.yazar)}</b>${m.sayfa?` <a href="#" class="kucuk" onclick="sayfaGoster('${m.id}',${m.sayfa});return false">kitapta s. ${m.sayfa} ⧉</a>`:""}<div class="k-metin ${m.yon==="rtl"?"rtl":""}">${m.kelimeler.map(kelime).join(" ")}</div></div>`).join("")}</div>
    ${D.yz?`<div class="grup"><h4>Müfessirlerin ortak ve farklı görüşleri (yapay zekâ özeti)</h4><div id="gorusKutu"></div></div>`:""}`);
   if(D.yz)goruslerSekme();
   document.querySelectorAll("[data-dil]").forEach(x=>x.onclick=()=>{karDil=x.dataset.dil;karSecili=null;karsilastirSekme()});
   document.querySelectorAll("#ic [data-k]").forEach(x=>x.onclick=()=>{karSecili=karSecili===x.dataset.k?null:x.dataset.k;ciz()});
  };ciz();
}

let tefTur="hepsi",tefDil="hepsi";
async function tefsirSekme(){
  yukle(); const [t,n]=await Promise.all([api(`/api/ayet/${D.s}/${D.a}/tefsirler`),api(`/api/ayet/${D.s}/${D.a}/inis`)]);
  const kayn=(n.vahidi?1:0)+n.rivayetler.length+n.turkce.length;
  const inisHtml=`<div class="inis-kutu"><b>İniş:</b> ${esc(n.yer||"?")} · iniş sırasına göre ${n.sira}. sure${kayn?` · <a href="#" onclick="this.parentNode.nextElementSibling.open=!this.parentNode.nextElementSibling.open;return false">iniş sebebi rivayetleri (${kayn} kaynak) ▾</a>`:" · bu ayet için iniş sebebi rivayeti bulunmadı"}</div>
   <details class="inis-detay"><summary></summary>
   ${n.turkce.map(r=>`<div class="oge"><b>${esc(r.ad)}</b>${r.parcalar.map(p=>`<div>${esc(p)}</div>`).join("")}</div>`).join("")}
   ${(n.vahidi||n.rivayetler.length)?`<div class="oge" id="nuzulCeviri">${n.ceviri?`<b>Türkçe çeviri (yapay zekâ)</b><div class="md">${md(n.ceviri)}</div>`:(D.yz?`<button class="btn ikincil" onclick="nuzulCevir(this)">Arapça/İngilizce rivayetleri Türkçeye çevir</button>`:"")}</div>`:""}
   ${n.vahidi?`<div class="oge"><b>Vâhidî — Esbâbü'n-Nüzûl</b> <span class="kucuk">(İngilizce)</span><div style="white-space:pre-wrap">${esc(n.vahidi)}</div></div>`:""}${n.rivayetler.map(r=>`<div class="oge"><b>${r.yil} · ${esc(r.ad)}</b>${r.parcalar.map(p=>`<div class="rtl" style="font-size:17px">${esc(p)}</div>`).join("")}</div>`).join("")}</details>`;
  const turler=[...new Set(t.map(x=>x.tur_ad))], diller=[...new Set(t.map(x=>x.dil))];
  const ciz=()=>{const sec=t.filter(x=>(tefTur==="hepsi"||x.tur_ad===tefTur)&&(tefDil==="hepsi"||x.dil===tefDil));
   ic(inisHtml+`<p class="kucuk">${t.length} tefsir, en eskiden günümüze sıralı. Başlığa tıklayınca tam metin açılır.</p>
    <div class="cipler">${["hepsi",...turler].map(d=>`<span class="cip ${d===tefTur?"aktif":""}" data-t="${esc(d)}">${d==="hepsi"?"Tüm türler":esc(d)}</span>`).join("")}</div>
    <div class="cipler">${["hepsi",...diller].map(d=>`<span class="cip ${d===tefDil?"aktif":""}" data-l="${esc(d)}">${d==="hepsi"?"Tüm diller":esc(d)}</span>`).join("")}</div>
    ${sec.map(x=>`<div class="oge"><div style="cursor:pointer" onclick="tefsirAc('${x.slug}',this)"><b>${x.yil<9999?(x.yil+" · "):""}${esc(x.ad)}</b> <span class="rozet">${esc(x.tur_ad)}</span> <span class="kucuk">${esc(x.dil)} · ${Math.round(x.uzunluk/100)/10}k harf</span>
     <div class="kucuk ${AR.test(x.ozet)?"rtl":""}" style="font-size:${AR.test(x.ozet)?"16px":"12px"}">${esc(x.ozet)}…</div></div><div class="tam"></div></div>`).join("")}`);
   document.querySelectorAll(".cip[data-t]").forEach(c=>c.onclick=()=>{tefTur=c.dataset.t;ciz()});
   document.querySelectorAll(".cip[data-l]").forEach(c=>c.onclick=()=>{tefDil=c.dataset.l;ciz()});};
  ciz();
}
async function tefsirAc(slug,el){const k=el.nextElementSibling; if(k.innerHTML){k.innerHTML="";return}
  k.innerHTML='<div class="yukleniyor">…</div>'; const d=await api(`/api/tefsir/${slug}/${D.s}/${D.a}`);
  k.innerHTML=`<div class="tefsir-metin ${AR.test(d.metin)?"rtl":""}">${esc(d.metin)}</div><button class="btn ikincil" style="margin-top:4px" onclick="alintiNot('${esc(d.ad).replace(/'/g,"\\'")}',this)">Bu tefsirden not al</button>`;}
async function nuzulCevir(b){b.disabled=true;b.textContent="Çevriliyor…";try{const d=await api(`/api/ayet/${D.s}/${D.a}/inis-cevir`,{method:"POST"});$("#nuzulCeviri").innerHTML=`<b>Türkçe çeviri (yapay zekâ)</b><div class="md">${md(d.metin)}</div>`}catch(e){b.disabled=false;b.textContent=e.message}}
function alintiNot(kaynak){sekme("notlar");setTimeout(()=>{$("#notMetin").value=`[${kaynak}] `;$("#notEtiket").value="tefsir";$("#notMetin").focus()},50)}

  ic(`<p class="kucuk">E-kitaba girecek yalın meal. Açıklama gerekiyorsa metne [1], [2] koyun; açıklamayı aşağıdaki dipnotlara yazın.</p>
   <textarea id="ymMetin" style="min-height:70px;font-size:16px">${esc(y.metin)}</textarea>
   <div id="ymDipnot">${dn.map((d,i)=>dipnotKutu(i+1,d)).join("")}</div>
   <p><button class="btn ikincil" onclick="dipnotEkle()">+ Dipnot</button>
   <select id="ymDurum"><option value="taslak">Taslak</option><option value="onayli">Onaylı</option></select>
   <button class="btn" onclick="yalinKaydet(this)">Kaydet</button>
   <button class="btn ikincil" onclick="yalinOneri(this)">Yapay zekâ önerisi al</button></p><div id="ymOneri"></div>`);
  $("#ymDurum").value=y.durum||"taslak";

const dipnotKutu=(n,t="")=>`<div style="display:flex;gap:6px;margin:6px 0"><b style="padding-top:8px">[${n}]</b><textarea class="ymDn" style="min-height:50px">${esc(t)}</textarea></div>`;
function dipnotEkle(){$("#ymDipnot").insertAdjacentHTML("beforeend",dipnotKutu(document.querySelectorAll(".ymDn").length+1))}
async function yalinKaydet(b){const d={metin:$("#ymMetin").value.trim(),dipnotlar:[...document.querySelectorAll(".ymDn")].map(x=>x.value.trim()).filter(Boolean),durum:$("#ymDurum").value};
  D.ayet.yalin=await api(`/api/yalin/${D.s}/${D.a}`,{method:"PUT",body:JSON.stringify(d)}); b.textContent="Kaydedildi ✓";setTimeout(()=>b.textContent="Kaydet",1500);
  const el=document.querySelector(`#ay${D.a} .yalin`); const h=esc(d.metin).replace(/\[(\d+)\]/g,"<sup>$1</sup>");
  if(el)el.innerHTML=h;else document.querySelector(`#ay${D.a} .meal`)?.insertAdjacentHTML("beforebegin",`<div class="yalin">${h}</div>`);}
async function yalinOneri(b){b.disabled=true;b.textContent="Kök, tefsir ve mealler taranıyor…";
  try{const d=await api(`/api/ayet/${D.s}/${D.a}/yalin-oneri`,{method:"POST"});
   $("#ymOneri").innerHTML=`<div class="not"><b>Öneri:</b> ${esc(d.meal)}${(d.dipnotlar||[]).map((x,i)=>`<div class="kucuk">[${i+1}] ${esc(x)}</div>`).join("")}<div class="kucuk"><i>${esc(d.gerekce||"")}</i></div><button class="btn ikincil" id="oneriAl">Bunu düzenleme alanına al</button></div>`;
   $("#oneriAl").onclick=()=>{$("#ymMetin").value=d.meal;$("#ymDipnot").innerHTML=(d.dipnotlar||[]).map((x,i)=>dipnotKutu(i+1,x)).join("")};
  }catch(e){$("#ymOneri").innerHTML=`<p class="kucuk">${esc(e.message)}</p>`}b.disabled=false;b.textContent="Yapay zekâ önerisi al"}

async function notlarSekme(){
  const n=await api(`/api/notlar?s=${D.s}&a=${D.a}`);
  ic(`<textarea id="notMetin" placeholder="Bu ${D.a?"ayet":"sure"} hakkında notunuz…"></textarea>
   <div style="display:flex;gap:6px;margin:6px 0"><input class="tam" id="notEtiket" placeholder="Etiket (örn. lügat, tefsir, soru)"><button class="btn" onclick="notEkle()">Ekle</button></div>
   <div id="notListe">${n.map(notKutu).join("")||'<p class="kucuk">Henüz not yok.</p>'}</div>`);
}
const notKutu=x=>`<div class="not" id="not${x.id}"><div>${esc(x.metin).replace(/\n/g,"<br>")}</div><div class="alt"><span>${x.etiket?"#"+esc(x.etiket)+" · ":""}${esc((x.guncelleme||x.olusturma||"").slice(0,16))}</span><span><a href="#" onclick="notDuzenle(${x.id});return false">düzenle</a> · <a href="#" onclick="notSil(${x.id});return false">sil</a></span></div></div>`;
async function notEkle(){const m=$("#notMetin").value.trim();if(!m)return;await api("/api/notlar",{method:"POST",body:JSON.stringify({s:D.s,a:D.a,metin:m,etiket:$("#notEtiket").value.trim()})});notlarSekme();D.sureler=await api("/api/sureler");sureListe()}
async function notSil(id){if(!confirmSil())return;await api("/api/notlar/"+id,{method:"DELETE"});document.getElementById("not"+id)?.remove()}
function confirmSil(){return true}
async function notDuzenle(id){const el=document.getElementById("not"+id);const n=(await api(`/api/notlar?s=${D.s}&a=${D.a}`)).find(x=>x.id===id)||(await api("/api/notlar")).find(x=>x.id===id);
  el.innerHTML=`<textarea>${esc(n.metin)}</textarea><input class="tam" value="${esc(n.etiket)}"><button class="btn">Kaydet</button>`;
  el.querySelector("button").onclick=async()=>{const r=await api("/api/notlar/"+id,{method:"PUT",body:JSON.stringify({metin:el.querySelector("textarea").value,etiket:el.querySelector("input").value})});el.outerHTML=notKutu(r)}}

// ---- Modallar ----
function modalAc(h){$("#modalIcerik").innerHTML=h;$("#modalArka").style.display="flex"}
function modalKapat(){$("#modalArka").style.display="none"}
async function notlarAc(q=""){const n=await api("/api/notlar?q="+encodeURIComponent(q));
  modalAc(`<h2 style="margin-top:0">Notlarım (${n.length})</h2><div style="display:flex;gap:6px"><input class="tam" id="notAra" placeholder="Notlarda ara…" value="${esc(q)}"><a class="btn" href="/api/notlar/disa-aktar" download="kuran-notlarim.md">Dışa aktar (.md)</a></div>
   ${n.map(x=>`<div class="not" style="cursor:pointer" onclick="modalKapat();sureAc(${x.s},${x.a||"null"});${x.a?"":`setTimeout(()=>ayetSec(${x.s},0),300)`}"><b>${esc(x.sure)} ${x.s}${x.a?":"+x.a:" (genel)"}</b>${x.etiket?' <span class="rozet">#'+esc(x.etiket)+"</span>":""}<div>${esc(x.metin).replace(/\n/g,"<br>")}</div></div>`).join("")}`);
  $("#notAra").onchange=e=>notlarAc(e.target.value);}
async function kitapAc(){
  modalAc(`<h2 style="margin-top:0">E-Kitap (EPUB)</h2><p>Yalın Türkçe meal; dipnotlar numaraya dokununca açılır.</p>
   <p><input class="tam" id="kSureler" placeholder="Sureler: boş = tüm Kur'an · 68 · ihlas · 78-114 · felak, nas" style="max-width:420px"></p>
   <p><label><input type="radio" name="kDil" value="tr" checked> Türkçe</label> &nbsp; <label><input type="radio" name="kDil" value="osm"> Osmanlıca </label></p>
   <label><input type="checkbox" id="kArapca"> Arapça aslını da ekle</label><br>
   <label><input type="checkbox" id="kTemel" checked> Yalın meali henüz olmayan ayetlerde Zahir'in mealini kullan</label><br>
   <label><input type="checkbox" id="kOnay"> Sadece onaylı ayetler</label>
   <p><button class="btn" onclick="kitapIndir()">EPUB indir</button> <span class="kucuk" id="kDurum"></span></p>`)}
function kitapIndir(){$("#kDurum").textContent="Hazırlanıyor… (tüm Kur'an birkaç saniye sürer)";location.href=`/api/kitap.epub?sureler=${encodeURIComponent($("#kSureler").value.trim())}&sadece_onayli=${$("#kOnay").checked}&arapca=${$("#kArapca").checked}&temel=${$("#kTemel").checked}&dil=${document.querySelector("input[name=kDil]:checked").value}`}
async function kaynakAc(yenile=false){const d=await api("/api/durum");const y=(a,b)=>b?Math.round(a/b*100)+"%":"-";
  const govde=`<p class="kucuk">Uygulama her şeyi kendi veritabanında tutar. Yerelde olmayan bir şey açılırsa internetten çekilip kaydedilir. "Tümünü indir" ile bütün külliyat bir kerede sunucuya alınır (internetsiz çalışır).</p>
   <div class="istat"><div><b>${d.ayet_metni.toLocaleString()}</b>Arapça ayet metni (Hafs + 7 kıraat)</div><div><b>${d.kelime.toLocaleString()}</b>kelime/morfoloji parçası</div>
   <div><b>${d.lane_kok.toLocaleString()}</b>Lane lügat maddesi</div><div><b>${d.meal_kaynak}</b>meal · ${y(d.meal_sure,d.meal_sure_hedef)} indirildi</div>
   <div><b>${d.tefsir_kaynak}</b>tefsir · ${y(d.tefsir_sure,d.tefsir_sure_hedef)} indirildi</div><div><b>${d.hadis.toLocaleString()}</b>hadis metni (ar/tr/en)</div>
   <div><b>${d.hadis_ayet.toLocaleString()}</b>hadis–ayet bağlantısı</div><div><b>${d.db_mb} MB</b>veritabanı</div><div><b>${d.yapay_zeka?"Açık":"Kapalı"}</b>yapay zekâ (çeviriler, görüş analizi)</div></div>
   <button class="btn" ${d.kurulum_calisiyor?"disabled":""} onclick="api('/api/kur',{method:'POST'}).then(()=>setTimeout(()=>kaynakAc(true),1500))">${d.kurulum_calisiyor?"İndiriliyor…":"Tüm kaynakları indir / güncelle"}</button>
   ${d.log?`<pre class="log">${esc(d.log)}</pre>`:""}`;
  if(yenile){const k=$("#kaynakGovde");if(k)k.innerHTML=govde;}
  else{modalAc(`<h2 style="margin-top:0">Kaynaklar</h2><div id="kaynakGovde">${govde}</div><h3 style="margin-top:22px">Meal dosyası</h3><div id="uretimKutu" class="kucuk">…</div>`);uretimCiz();}
  if(d.kurulum_calisiyor)setTimeout(()=>{if($("#modalArka").style.display==="flex"&&$("#kaynakGovde"))kaynakAc(true)},4000)}

async function uretimCiz(){const u=await api("/api/uretim");const k=$("#uretimKutu");if(!k)return;
  if(!k.dataset.cizildi){const b=await api("/api/ayarlar");k.dataset.cizildi="1";
  k.innerHTML=`<p><b id="uDurum"></b></p>
   <p id="uTaslak"></p>
   <pre class="log" id="uLog" style="display:none"></pre>
   <p style="margin-top:14px"><b>Düzeltilmiş meal dosyası içe aktar</b> (inceleme dosyası biçiminde .json): <input type="file" accept=".json" onchange="iceAktar(this)"></p>`;}
  $("#uDurum").textContent=`Okuma ekranında sizin mealiniz gösteriliyor (${u.onayli} ayet onaylı dosyadan).`;
  $("#uTaslak").innerHTML=u.taslak?`<span class="not">${u.taslak.toLocaleString()} ayette veritabanında ayrı bir taslak meal var; bu ayetlerde sizin mealinizin yerine o gösteriliyor.</span> <button class="btn ikincil" onclick="if(confirm('Taslak mealler silinsin, bu ayetlerde sizin mealiniz gösterilsin mi?'))api('/api/yalin/taslaklar',{method:'DELETE'}).then(()=>{D.sureler=null;location.reload()})">Taslakları sil</button>`:"";
  const lg=$("#uLog");lg.style.display=u.log?"block":"none";lg.textContent=u.log;lg.scrollTop=lg.scrollHeight;
  if(u.calisiyor)setTimeout(()=>{if($("#uretimKutu"))uretimCiz()},5000)}

async function iceAktar(inp){const f=inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());const r=await api("/api/yalin/ice-aktar",{method:"POST",body:JSON.stringify(d)});
  alertYok(`${r.ayet} ayet içe aktarıldı.`);D.sureler=await api("/api/sureler");sureListe();if(D.s===d.sure)sureAc(D.s);uretimCiz()}catch(e){alertYok("Hata: "+e.message)}}
function alertYok(m){const k=$("#uretimKutu");if(k)k.insertAdjacentHTML("afterbegin",`<p class="not">${esc(m)}</p>`)}

function sayfaGoster(mid,n){modalAc(`<h3 style="margin-top:0">Kitabın aslı · sayfa ${n}</h3>
  <p class="kucuk"><a href="#" onclick="sayfaGoster('${mid}',${n-1});return false">‹ önceki</a> · <a href="#" onclick="sayfaGoster('${mid}',${n+1});return false">sonraki ›</a></p>
  <img src="/api/ozel/${mid}/sayfa/${n}.png" style="max-width:100%;max-height:75vh;display:block;margin:auto;box-shadow:0 2px 12px rgba(0,0,0,.2)" onerror="this.outerHTML='<p class=kucuk>Sayfa görüntüsü yok: PDF dosyası sunucudaki veri/ozel klasöründe olmalı.</p>'">`)}

// ---- Arama ----
$("#ara").onkeydown=async e=>{if(e.key!=="Enter")return;const q=e.target.value.trim();if(!q)return;
  const m=q.match(/^(\d+)[:. ](\d+)$/); if(m)return sureAc(+m[1],+m[2]); if(/^\d+$/.test(q))return sureAc(+q);
  modalAc('<div class="yukleniyor">Aranıyor…</div>');const r=await api(`/api/ara?q=${encodeURIComponent(q)}&meal=${D.meal}`);
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  modalAc(`<h2 style="margin-top:0">“${esc(q)}” — ${r.length} sonuç</h2>`+r.map(x=>`<div class="oge" style="cursor:pointer" onclick="modalKapat();sureAc(${x.s},${x.a})"><b>${esc(x.sure)} ${x.s}:${x.a}</b><div class="${AR.test(x.metin)?"rtl":""}">${AR.test(q)?esc(x.metin):esc(x.metin).replace(re,m=>"<mark>"+m+"</mark>")}</div></div>`).join(""))};
document.addEventListener("keydown",e=>{if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT")return;
  if(e.key==="Escape")modalKapat(); if(D.a&&e.key==="ArrowDown"){e.preventDefault();ayetSec(D.s,Math.min(D.sureler[D.s-1].ayet,D.a+1));document.getElementById("ay"+D.a)?.scrollIntoView({block:"center"})}
  if(D.a&&e.key==="ArrowUp"){e.preventDefault();ayetSec(D.s,Math.max(1,D.a-1));document.getElementById("ay"+D.a)?.scrollIntoView({block:"center"})}});
basla();
</script>
