# Dedplay Kur'an Çalışma — ZimaOS / Docker kurulumu
# ZimaOS: App Store > Custom Install > Import (bu dosyayı yapıştırın)
# Komut satırı: docker compose up -d
name: kuran-calisma
services:
  kuran-calisma:
    image: ghcr.io/berzahbey/kuran:latest      # GitHub'a her gönderimde otomatik derlenir
    # Derlenmiş imaj yerine doğrudan GitHub'daki koddan derlemek için üstteki satırı silip şunu açın:
    # build: https://github.com/berzahbey/kuran.git#main
    container_name: kuran-calisma
    restart: unless-stopped
    ports:
      - "8120:8120"
    volumes:
      - /DATA/AppData/kuran-calisma/veri:/veri   # tüm külliyat + notlar + yalın meal (~2.3 GB)
    environment:
      KURAN_OTOMATIK_INDIR: "1"          # ilk açılışta tüm kaynakları arka planda indirir (~20 dk)
      KURAN_MEAL: tur-elmalilihamdiya
      # --- Yapay zekâ (yalın meal taslağı için; boş bırakılırsa uygulama yine tam çalışır) ---
      # Ücretsiz: https://aistudio.google.com → "Get API key" → anahtarı aşağıya yapıştırın
      YZ_SAGLAYICI: gemini               # gemini | openai (OpenRouter/Groq/Ollama) | anthropic
      YZ_ANAHTAR: ""
      YZ_MODEL: gemini-flash-latest      # AI Studio'daki ücretsiz modellerden biri
      YZ_DAKIKADA: "8"                   # ücretsiz katman için dakikada istek sınırı
      URETIM_PAKET: tam                  # kaynak paketi: tam | orta | kucuk (token sınırı hatası alırsanız küçültün)
      # OpenRouter örneği:  YZ_SAGLAYICI: openai  YZ_URL: https://openrouter.ai/api/v1/chat/completions  YZ_MODEL: <ücretsiz model>:free
      # Yerel Ollama örneği: YZ_SAGLAYICI: openai  YZ_URL: http://dedplay:11434/v1/chat/completions  YZ_MODEL: qwen2.5:14b
